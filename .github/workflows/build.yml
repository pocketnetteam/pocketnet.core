name: Build
run-name: "Build: ${{ github.ref_name }} . ${{ inputs.tag || 'latest' }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific tag for building"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || steps.branch-name.outputs.ref_branch }}
      - name: Detect actual version
        id: version
        run: |
          VERSION=$(./share/version.sh)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

  build-linux:
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || steps.branch-name.outputs.ref_branch }}
      - name: Cache depends
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: depends/x86_64-pc-linux-gnu
          key: linux-depends-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/**/*.mk') }}
          restore-keys: linux-depends-
      - name: Setup Docker
        run: |
          echo "Using Docker container with Ubuntu 20.04 for building"
      - name: Build in Docker container
        run: |
          docker run --rm -v $PWD:/source -w /source ubuntu:20.04 /bin/bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt update && apt install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils python3 libprotobuf-dev protobuf-compiler curl bison byacc

            if [ ! -d "depends/x86_64-pc-linux-gnu" ] || [ -z "$(ls -A depends/x86_64-pc-linux-gnu)" ]; then
              cd depends && make HOST=x86_64-pc-linux-gnu -j4
              cd ..
            fi
            
            ./autogen.sh && \
            CONFIG_SITE=$PWD/depends/x86_64-pc-linux-gnu/share/config.site ./configure --prefix=/usr/local && \
            make -j4 && \
            make deploy
          '
      - name: Prepare output binaries
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          mkdir ./out/
          cp ./release/usr/local/bin/pocketcoind ./out/pocketnetcore_${VERSION}_linux_x64_daemon.bin
          cp ./pocketnetcore_*_linux_x64_setup.deb ./out/pocketnetcore_${VERSION}_linux_x64_setup.deb
          cp ./pocketnetcore_*_linux_x64.tar.gz ./out/pocketnetcore_${VERSION}_linux_x64.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux_x64
          path: ./out/*

  build-windows:
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || steps.branch-name.outputs.ref_branch }}
      - name: Cache depends
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: depends/x86_64-w64-mingw32
          key: windows-depends-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/**/*.mk') }}
          restore-keys: windows-depends-
      - name: Setup Docker
        run: |
          echo "Using Docker container with Ubuntu 20.04 for building Windows binaries"
      - name: Build in Docker container
        run: |
          docker run --rm -v $PWD:/source -w /source ubuntu:20.04 /bin/bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt update && apt install -y curl build-essential libtool autotools-dev automake pkg-config nsis g++-mingw-w64-x86-64
            update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
            
            if [ ! -d "depends/x86_64-w64-mingw32" ] || [ -z "$(ls -A depends/x86_64-w64-mingw32)" ]; then
              cd depends && make HOST=x86_64-w64-mingw32 -j4
              cd ..
            fi
            
            ./autogen.sh
            CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site ./configure --prefix=/
            make -j4
            make deploy
          '
      - name: Prepare output binaries
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          mkdir ./out/
          cp ./release/pocketcoind.exe ./out/pocketnetcore_${VERSION}_win_x64_daemon.bin
          cp ./pocketnetcore_*_win_x64_setup.exe ./out/pocketnetcore_${VERSION}_win_x64_setup.exe
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows_x64
          path: ./out/*

  build-macos-arm64:
    runs-on: macos-14
    needs: prepare
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch-name.outputs.ref_branch }}
      - name: Install general dependencies
        run: brew install automake make libtool miniupnpc protobuf qrencode librsvg python-setuptools
      - name: Cache depends
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: depends/arm-apple-darwin23.6.0
          key: macos-arm64-depends-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/**/*.mk') }}
          restore-keys: macos-arm64-depends-
      - name: Build depends
        if: steps.cache-depends.outputs.cache-hit != 'true'
        run: cd depends && make && cd ..
      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=$PWD/depends/arm-apple-darwin23.6.0
      - name: Make
        run: |
          make -j4
          make deploy
      - name: Sign App
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain 
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          /usr/bin/codesign --force -s "$MACOS_CERTIFICATE_NAME" --options runtime dist/Pocketcoin-Qt.app -v
      - name: Notarize App
        env:
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$PROD_MACOS_NOTARIZATION_APPLE_ID" --team-id "$PROD_MACOS_NOTARIZATION_TEAM_ID" --password "$PROD_MACOS_NOTARIZATION_PWD"
          ditto -c -k --keepParent "dist/Pocketcoin-Qt.app" "notarization.zip"
          xcrun notarytool submit "notarization.zip" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "dist/Pocketcoin-Qt.app"
      - name: Build DMG image
        run: |
          ./contrib/macdeploy/createdmg Pocketcoin-Qt.app Pocketnet-Core
      - name: Prepare output binaries
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          mkdir ./out/
          cp ./src/pocketcoind ./out/pocketnetcore_${VERSION}_macos_arm64_daemon.bin
          cp ./Pocketnet-Core.dmg ./out/pocketnetcore_${VERSION}_macos_arm64_setup.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacOS_arm64
          path: ./out/*

  build-macos-amd64:
    runs-on: macos-13
    needs: prepare
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Install general dependencies
        run: |
          brew install automake make miniupnpc protobuf qrencode librsvg python-setuptools berkeley-db@4
          pip3 install setuptools
      - name: Cache depends
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: depends/x86_64-apple-darwin22.6.0
          key: macos-amd64-depends-${{ hashFiles('depends/Makefile', 'depends/funcs.mk', 'depends/packages/**/*.mk') }}
          restore-keys: macos-amd64-depends-
      - name: Build depends
        if: steps.cache-depends.outputs.cache-hit != 'true'
        run: cd depends && make && cd ..
      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix=$PWD/depends/x86_64-apple-darwin22.6.0
      - name: Make
        run: |
          make -j4
          make deploy
      - name: Sign App
        env:
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain 
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PWD" build.keychain
          /usr/bin/codesign --force -s "$MACOS_CERTIFICATE_NAME" --options runtime dist/Pocketcoin-Qt.app -v
      - name: Notarize App
        env:
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$PROD_MACOS_NOTARIZATION_APPLE_ID" --team-id "$PROD_MACOS_NOTARIZATION_TEAM_ID" --password "$PROD_MACOS_NOTARIZATION_PWD"
          ditto -c -k --keepParent "dist/Pocketcoin-Qt.app" "notarization.zip"
          xcrun notarytool submit "notarization.zip" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "dist/Pocketcoin-Qt.app"
      - name: Build DMG image
        run: |
          ./contrib/macdeploy/createdmg Pocketcoin-Qt.app Pocketnet-Core
      - name: Prepare output binaries
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          mkdir ./out/
          cp ./src/pocketcoind ./out/pocketnetcore_${VERSION}_macos_x64_daemon.bin
          cp ./Pocketnet-Core.dmg ./out/pocketnetcore_${VERSION}_macos_x64_setup.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacOS_x64
          path: ./out/*
